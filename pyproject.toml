[project]
name = "chainloom"
version = "0.1.0"
description = "Local desktop application for encrypted wallets and EVM transfers"
requires-python = ">=3.13"
dependencies = [
    "pyside6==6.10.2",
    "web3>=7.14,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
chainloom-desktop = "chainloom.desktop.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "eth-tester[py-evm]>=0.14.0b1",
    "pyinstaller>=6,<7",
    "pytest>=9.2.0",
    "pytest-qt>=4,<5",
    "ruff>=0.17.3",
]
